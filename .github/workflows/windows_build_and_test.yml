name: Windows unit tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      RUNNER_LABEL:
        description: 'Match Runner Label'
        required: false
        type: string


# cancel previous job if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-and-test:
    runs-on:
      - ${{ (inputs.RUNNER_LABEL == '' && 'self-hosted') || inputs.RUNNER_LABEL }}
      - self-hosted
      - Windows
      - X64
    #
    # If the user who clicked "Run Workflow" button left the RUNNER_LABEL field blank,
    # the default evaluated output is the string 'self-hosted'.
    # Otherwise set it to the value the user specified when they clicked "Run Workflow"
    #

    steps:
      - name: Print shell environment vars (debug)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: "Get-ChildItem Env: | Sort-Object Name | Format-Table -AutoSize"

      - uses: actions/checkout@v6
        with:
          # Needed to fetch the tags for versioningit
          fetch-depth: 100
          fetch-tags: true

      # - name: Run unit tests on Windows
      #   shell: pwsh
      #   run: |
      #     $workspace = ("${{ github.workspace }}" -replace '\\', '/')
      #     & "C:/Program Files/Git/bin/bash.exe" -ex ($workspace + "/buildconfig/Jenkins/Conda/conda-buildscript") $workspace win-64-ci --extra-cmake-flags "--fresh"

      - name: Create mock log files for upload testing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/build/test_logs"
          "Mock build log - $(Get-Date)" | Out-File "${{ github.workspace }}/build/test_logs/build.log"
          "Mock test log - $(Get-Date)" | Out-File "${{ github.workspace }}/build/test_logs/test.log"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/build/Testing"
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="MockSuite" tests="2" failures="0" errors="0" time="0.1">
              <testcase name="MockTestPass1" classname="MockSuite" time="0.05"/>
              <testcase name="MockTestPass2" classname="MockSuite" time="0.05"/>
            </testsuite>
          </testsuites>
          "@ | Out-File "${{ github.workspace }}/build/Testing/mock_unittest.xml" -Encoding utf8

      - name: Upload build and test log artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test_logs
          path: ${{ github.workspace }}/build/test_logs/*.log

      - name: Setup Python for unit test report
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Unit test report
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: (!cancelled())
        with:
          check_name: "Unit test results"
          check_run: false
          files: build/Testing/*unittest.xml
